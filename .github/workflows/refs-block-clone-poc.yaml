name: ReFS block-clone probe

on:
  push:
    branches:
      - poc/refs-block-clone-orphan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Create a temporary ReFS volume and clone a file
        shell: pwsh
        run: ./poc/refs-block-clone.ps1
