name: Btrfs reflink probe

on:
  push:
    branches:
      - poc/btrfs-reflink
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Create a temporary Btrfs volume and reflink a file
        shell: bash
        run: bash ./poc/btrfs-reflink.sh
